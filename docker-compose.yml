# Reference Coder deployment (Docker Compose).
#
# Upstream reference (keep in sync when bumping Coder / Postgres patterns):
#   https://github.com/coder/coder/blob/main/compose.yaml
# Docs: https://coder.com/docs/install/docker
#
# Repo root is the Compose project directory so bind mounts resolve:
#   ./template → /templates (for coder templates push)
#   ./coder-deployment → /deploy (for post-deploy.sh)
#
# Coolify: build-pack Docker Compose, Base directory: . (repo root).
#
# This stack adds: dedicated PostgreSQL (same pattern as upstream), external `coolify` network,
# OIDC/token env for Authentik, HTTP on 4099 (upstream defaults to 7080 — see docs/CODER_OFFICIAL_DEPLOYMENT.md).

services:
  database:
    # Minimum supported major version is 13 (Coder docs). Upstream uses postgres:17.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coder}
      # Override in production (Coolify secret); default is dev-only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-coder}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-coder} -d ${POSTGRES_DB:-coder}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coolify

  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION:-latest}
    depends_on:
      database:
        condition: service_healthy
    # Do not set command: server — image ENTRYPOINT is ["/opt/coder", "server"].
    environment:
      # Same shape as upstream compose.yaml (host defaults to port 5432).
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER:-coder}:${POSTGRES_PASSWORD:-changeme}@database/${POSTGRES_DB:-coder}?sslmode=disable"
      # Must be a URL workspaces and users can reach (not localhost for non-local templates). Set in Coolify / .env.
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://dev.example.com}
      CODER_HTTP_ADDRESS: "0.0.0.0:4099"
      CODER_DEFAULT_TOKEN_LIFETIME: ${CODER_DEFAULT_TOKEN_LIFETIME:-8760h}
      CODER_MAX_ADMIN_TOKEN_LIFETIME: ${CODER_MAX_ADMIN_TOKEN_LIFETIME:-8760h}
      CODER_OIDC_ISSUER_URL: ${CODER_OIDC_ISSUER_URL:-}
      CODER_OIDC_CLIENT_ID: ${CODER_OIDC_CLIENT_ID:-}
      CODER_OIDC_CLIENT_SECRET: ${CODER_OIDC_CLIENT_SECRET:-}
      CODER_OIDC_EMAIL_FIELD: ${CODER_OIDC_EMAIL_FIELD:-email}
      CODER_OIDC_USERNAME_FIELD: ${CODER_OIDC_USERNAME_FIELD:-preferred_username}
      # Quoted so Compose always passes a string to Coder (bootstrap may set false in .env).
      CODER_DISABLE_PASSWORD_AUTH: "${CODER_DISABLE_PASSWORD_AUTH:-true}"
      CODER_PROVISIONER_DAEMON: "true"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      CODER_URL: ${CODER_URL:-http://127.0.0.1:4099}
      CODER_TOKEN: ${CODER_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/zanzythebar/coder-opencode-sandbox:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./template:/templates:ro
      - ./coder-deployment:/deploy:ro
    # Coder runs non-root; if the provisioner gets "permission denied" on docker.sock, set
    # DOCKER_GID from: getent group docker | cut -d: -f3  (see docs/CODER_OFFICIAL_DEPLOYMENT.md)
    # group_add:
    #   - "${DOCKER_GID}"
    ports:
      - "${CODER_HOST_PORT:-4099}:4099"
    restart: unless-stopped
    networks:
      - coolify

volumes:
  postgres-data:
    driver: local
    name: ${POSTGRES_DATA_VOLUME_NAME:-coder_opencode_sandbox_postgres_data}

networks:
  coolify:
    external: true
