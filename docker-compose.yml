# Reference Coder deployment.
# Upstream reference:
#   https://github.com/coder/coder/blob/main/compose.yaml
# Docs: https://coder.com/docs/install/docker
#
# Keep Compose at repo root so these bind mounts resolve:
#   ./template → /templates (for coder templates push)
#   ./coder-deployment → /deploy (for post-deploy.sh)
#
# Coolify base directory: `.`
# This stack adds PostgreSQL, the external `coolify` network, OIDC env, and HTTP on 4099.

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coder}
      # Override in production (Coolify secret); default is dev-only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-coder}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-coder} -d ${POSTGRES_DB:-coder}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coolify

  # Run the post-deploy command in this service, not `database`.
  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION:-latest}
    depends_on:
      database:
        condition: service_healthy
    # Let the image entrypoint start Coder server.
    # Run as root so post-deploy can rewrite the bind-mounted template directory.
    user: "0:0"
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER:-coder}:${POSTGRES_PASSWORD:-changeme}@database/${POSTGRES_DB:-coder}?sslmode=disable"
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://dev.example.com}
      # Required for subdomain workspace apps and VS Code Desktop SSH hostnames.
      CODER_WILDCARD_ACCESS_URL: ${CODER_WILDCARD_ACCESS_URL:-}
      CODER_HTTP_ADDRESS: "0.0.0.0:4099"
      CODER_DEFAULT_TOKEN_LIFETIME: ${CODER_DEFAULT_TOKEN_LIFETIME:-8760h}
      CODER_MAX_ADMIN_TOKEN_LIFETIME: ${CODER_MAX_ADMIN_TOKEN_LIFETIME:-8760h}
      CODER_OIDC_ISSUER_URL: ${CODER_OIDC_ISSUER_URL:-}
      CODER_OIDC_CLIENT_ID: ${CODER_OIDC_CLIENT_ID:-}
      CODER_OIDC_CLIENT_SECRET: ${CODER_OIDC_CLIENT_SECRET:-}
      CODER_OIDC_EMAIL_FIELD: ${CODER_OIDC_EMAIL_FIELD:-email}
      CODER_OIDC_USERNAME_FIELD: ${CODER_OIDC_USERNAME_FIELD:-preferred_username}
      CODER_DISABLE_PASSWORD_AUTH: "${CODER_DISABLE_PASSWORD_AUTH:-true}"
      CODER_PROVISIONER_DAEMON: "true"
      CODER_DERP_FORCE_WEBSOCKETS: "${CODER_DERP_FORCE_WEBSOCKETS:-true}"
      CODER_BLOCK_DIRECT: "${CODER_BLOCK_DIRECT:-true}"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      CODER_URL: ${CODER_URL:-http://127.0.0.1:4099}
      CODER_TOKEN: ${CODER_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/zanzythebar/coder-opencode-sandbox@sha256:cc1b96eb61212139f4767020b7d094eb179515706083103ef75b1a3da76a25e4}
      POST_DEPLOY_TEMPLATE_SOURCE: ${POST_DEPLOY_TEMPLATE_SOURCE:-deployed_commit}
      POST_DEPLOY_GITHUB_REPO: ${POST_DEPLOY_GITHUB_REPO:-ZanzyTHEbar/coder-opencode-sandbox}
      POST_DEPLOY_GITHUB_REF: ${POST_DEPLOY_GITHUB_REF:-}
      POST_DEPLOY_GITHUB_REF_TYPE: ${POST_DEPLOY_GITHUB_REF_TYPE:-heads}
      POST_DEPLOY_GITHUB_TOKEN: ${POST_DEPLOY_GITHUB_TOKEN:-}
      POST_DEPLOY_SYNC_TEMPLATE_MOUNT: "${POST_DEPLOY_SYNC_TEMPLATE_MOUNT:-1}"
    labels:
      # Coolify only creates routers for the primary hostname, so add explicit wildcard routers for workspace apps.
      # Traefik v3 expects pure regex syntax here.
      traefik.enable: "true"
      traefik.http.middlewares.coder-wildcard-redirect.redirectscheme.scheme: "https"
      traefik.http.routers.coder-wildcard-http.entrypoints: "http"
      traefik.http.routers.coder-wildcard-http.rule: "HostRegexp(`[a-z0-9-]+\\.${SERVICE_FQDN_CODER}`) && PathPrefix(`/`)"
      traefik.http.routers.coder-wildcard-http.middlewares: "coder-wildcard-redirect"
      traefik.http.routers.coder-wildcard-http.service: "coder-wildcard"
      traefik.http.routers.coder-wildcard-https.entrypoints: "https"
      traefik.http.routers.coder-wildcard-https.rule: "HostRegexp(`[a-z0-9-]+\\.${SERVICE_FQDN_CODER}`) && PathPrefix(`/`)"
      traefik.http.routers.coder-wildcard-https.service: "coder-wildcard"
      traefik.http.routers.coder-wildcard-https.tls: "true"
      traefik.http.routers.coder-wildcard-https.tls.certresolver: "letsencrypt"
      traefik.http.services.coder-wildcard.loadbalancer.server.port: "4099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./template:/templates
      - ./coder-deployment:/deploy:ro
    # Keep DOCKER_GID aligned with the host.
    group_add:
      - "${DOCKER_GID:-996}"
    ports:
      - "${CODER_HOST_PORT:-4099}:4099"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 3 http://127.0.0.1:4099/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - coolify

volumes:
  postgres-data:
    driver: local
    name: ${POSTGRES_DATA_VOLUME_NAME:-coder_opencode_sandbox_postgres_data}

networks:
  coolify:
    external: true
