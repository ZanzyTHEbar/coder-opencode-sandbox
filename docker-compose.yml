# Reference Coder deployment (Docker Compose).
# Repo root is the Compose project directory so bind mounts resolve:
#   ./template → /templates (for coder templates push)
#   ./coder-deployment → /deploy (for post-deploy.sh)
#
# Coolify: build-pack Docker Compose, Base directory: . (repo root, leave empty if Coolify defaults to root).
#
# Persistence: built-in Postgres uses ~/.config/coderv2/postgres (Coder v2), NOT ~/.coder.
# Mount the volume at /home/coder/.config/coderv2 so data lives on the named volume.
# Do NOT mount only .../.config/coder — Coder must create .../coderv2; a sibling mount can make
# mkdir /home/coder/.config/coderv2 fail with "permission denied" (see coder/coder#4970).
# Coolify: explicit volume name: + CODER_DATA_VOLUME_NAME if multiple Coders/host.

services:
  coder:
    image: ghcr.io/coder/coder:latest
    # Do not set command: server — the image ENTRYPOINT is already ["/opt/coder", "server"].
    # Adding command: server becomes "/opt/coder server server" and fails with "unrecognized subcommand server".
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://dev.example.com}
      CODER_HTTP_ADDRESS: "0.0.0.0:4099"
      # API token lifetimes — Coder defaults are 168h (7d) for default + admin-created tokens.
      # Raise these so automation tokens (e.g. Coolify CODER_TOKEN for post-deploy) can last longer.
      # See docs/COOLIFY_E2E.md § "API tokens and 7-day expiry".
      CODER_DEFAULT_TOKEN_LIFETIME: ${CODER_DEFAULT_TOKEN_LIFETIME:-8760h}
      CODER_MAX_ADMIN_TOKEN_LIFETIME: ${CODER_MAX_ADMIN_TOKEN_LIFETIME:-8760h}
      # OIDC (Authentik) — set these for your IdP.
      CODER_OIDC_ISSUER_URL: ${CODER_OIDC_ISSUER_URL}
      CODER_OIDC_CLIENT_ID: ${CODER_OIDC_CLIENT_ID}
      CODER_OIDC_CLIENT_SECRET: ${CODER_OIDC_CLIENT_SECRET}
      CODER_OIDC_EMAIL_FIELD: ${CODER_OIDC_EMAIL_FIELD:-email}
      CODER_OIDC_USERNAME_FIELD: ${CODER_OIDC_USERNAME_FIELD:-preferred_username}
      CODER_DISABLE_PASSWORD_AUTH: "true"
      # Provisioner needs Docker to create workspace containers.
      CODER_PROVISIONER_DAEMON: "true"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      # For post-deploy template push (Coolify): set CODER_URL + CODER_TOKEN in Coolify env.
      CODER_URL: ${CODER_URL:-http://127.0.0.1:4099}
      CODER_TOKEN: ${CODER_TOKEN:-}
      # Must appear here so Coolify injects it into the container for post-deploy.sh (same default as post-deploy.sh).
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/zanzythebar/coder-opencode-sandbox:latest}
    volumes:
      # Embedded Postgres: ~/.config/coderv2/postgres (Coder v2)
      - coder-data:/home/coder/.config/coderv2
      - /var/run/docker.sock:/var/run/docker.sock
      - ./template:/templates:ro
      - ./coder-deployment:/deploy:ro
    ports:
      - "4099:4099"
    restart: unless-stopped
    networks:
      - coolify

volumes:
  coder-data:
    driver: local
    # Stable across redeploys; override in Coolify if this host runs more than one Coder from this compose.
    name: ${CODER_DATA_VOLUME_NAME:-coder_opencode_sandbox_server_data}

networks:
  coolify:
    external: true
