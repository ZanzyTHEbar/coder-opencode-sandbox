# Build the Docker-only OpenCode runtime against the latest upstream release.

name: Update OpenCode Docker runtime

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "OpenCode version without v, or latest"
        required: false
        default: latest

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve OpenCode version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.opencode_version || 'latest' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_VERSION" = "latest" ]; then
            version=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name | sub("^v"; "")')
          else
            version=${REQUESTED_VERSION#v}
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid OpenCode version: $version" >&2
            exit 1
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.opencode_version || 'latest' }}
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image_base=$(echo "${{ env.REGISTRY }}/${{ github.repository }}-opencode-docker" | tr '[:upper:]' '[:lower:]')
          short_sha=${GITHUB_SHA::7}
          {
            echo "image_base=$image_base"
            echo "short_sha=$short_sha"
            echo "tags<<EOF"
            if [ "${{ github.event_name }}" = "schedule" ] || [ "$REQUESTED_VERSION" = "latest" ]; then
              echo "$image_base:latest"
            fi
            echo "$image_base:$short_sha"
            echo "$image_base:v$RESOLVED_VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker-only runtime
        uses: docker/build-push-action@v5
        with:
          context: ./opencode-docker
          file: ./opencode-docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.version }}
