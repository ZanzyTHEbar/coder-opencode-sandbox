# Build OpenCode sandbox image and push to GHCR (public).
# Image: ghcr.io/<owner>/coder-opencode-sandbox:latest (and :<short_sha>, :v<opencode_version>)
# After first run: repo → Packages → coder-opencode-sandbox → Package settings → Change visibility to Public.

name: Build and push image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and set image base (GHCR requires lowercase)
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          OPENCODE_VER=$(grep -m1 'ARG OPENCODE_VERSION=' image/Dockerfile | sed 's/.*=//')
          echo "opencode_version=${OPENCODE_VER}" >> $GITHUB_OUTPUT
          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./image
          file: ./image/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:latest
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_base }}:v${{ steps.meta.outputs.opencode_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_VERSION=${{ steps.meta.outputs.opencode_version }}
