# Build OpenCode sandbox image, scan it, then promote stable GHCR tags.
# Image: ghcr.io/<owner>/coder-opencode-sandbox:latest (and :<short_sha>, :v<opencode_version>) after scan/SBOM passes.
# After first run: repo → Packages → coder-opencode-sandbox → Package settings → Change visibility to Public.

name: Build and push image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive template template-kubernetes infra/terraform/runtime-plane
      - name: Terraform init and validate Docker template
        working-directory: template
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform init and validate Kubernetes template
        working-directory: template-kubernetes
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform init and validate runtime-plane scaffold
        working-directory: infra/terraform/runtime-plane
        run: |
          terraform init -backend=false
          terraform validate

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and set image base (GHCR requires lowercase)
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          # Use last ARG OPENCODE_VERSION= (build stage) when Dockerfile has multiple.
          OPENCODE_VER=$(grep 'ARG OPENCODE_VERSION=' image/Dockerfile | tail -1 | sed 's/.*=//')
          echo "opencode_version=${OPENCODE_VER}" >> $GITHUB_OUTPUT
          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT

      - name: Build and push scan candidate
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./image
          file: ./image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_base }}:scan-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_VERSION=${{ steps.meta.outputs.opencode_version }}

      - name: Scan pushed image
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_base }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -v "$HOME/.docker:/root/.docker:ro" aquasec/trivy:0.58.2 image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "$IMAGE_REF"

      - name: Generate SBOM
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_base }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/sbom:/out" \
            anchore/syft:v1.18.1 "$IMAGE_REF" \
            -o spdx-json=/out/coder-opencode-sandbox.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: coder-opencode-sandbox-sbom
          path: sbom/coder-opencode-sandbox.spdx.json

      - name: Promote scanned image tags
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_base }}@${{ steps.build.outputs.digest }}
          IMAGE_BASE: ${{ steps.meta.outputs.image_base }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          OPENCODE_VERSION: ${{ steps.meta.outputs.opencode_version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_BASE:latest" \
            -t "$IMAGE_BASE:$SHORT_SHA" \
            -t "$IMAGE_BASE:v$OPENCODE_VERSION" \
            "$IMAGE_REF"
